<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eaf0e8" />
    <link rel="icon" href="data:," />
    <title>无尽街区 · 键盘追缉</title>
  </head>
  <body>
    <main class="shell" id="app" data-state="loading">
      <header class="masthead">
        <span class="wordmark"><span class="grid-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>键盘追缉</span>
        <span class="view-kind">实时 3D <i></i> 固定斜俯视</span>
      </header>

      <section class="intro" aria-labelledby="title">
        <div class="intro-copy">
          <h1 id="title">无尽街区<span aria-hidden="true">.</span></h1>
          <p>打字加速，尽可能跑得更远。</p>
        </div>
        <div class="run-controls">
          <button type="button" id="reset" class="button" disabled>重置</button>
          <button type="button" id="auto" class="button primary" disabled>自动演示</button>
        </div>
      </section>

      <details class="speed-panel" id="speed-panel">
        <summary>开发者调参</summary>
        <form novalidate>
          <div class="speed-groups">
            <fieldset disabled>
              <legend>小偷</legend>
              <div class="speed-fields">
                <label>基础跑速<span class="speed-input"><input name="baseSpeed" type="number" min="0" step="0.5" required /><span>m/s</span></span></label>
                <label>最高跑速<span class="speed-input"><input name="maxSpeed" type="number" min="0" step="0.5" required /><span>m/s</span></span></label>
                <label>每字加速<span class="speed-input"><input name="boost" type="number" min="0" step="0.1" required /><span>m/s</span></span></label>
                <label>减速等待<span class="speed-input"><input name="brakeDelay" type="number" min="0" step="0.1" required /><span>s</span></span></label>
                <label>减速度<span class="speed-input"><input name="deceleration" type="number" min="0" step="0.1" required /><span>m/s²</span></span></label>
              </div>
              <p class="speed-estimate" data-first-step></p>
            </fieldset>
            <fieldset disabled>
              <legend>警察</legend>
              <div class="speed-fields">
                <label>起跑速度<span class="speed-input"><input name="policeStartSpeed" type="number" min="0" step="0.5" required /><span>m/s</span></span></label>
                <label>最高跑速<span class="speed-input"><input name="policeMaxSpeed" type="number" min="0" step="0.5" required /><span>m/s</span></span></label>
                <label>加速度<span class="speed-input"><input name="policeAcceleration" type="number" min="0" step="0.025" required /><span>m/s²</span></span></label>
              </div>
              <p class="speed-estimate" data-cap-time></p>
            </fieldset>
          </div>
          <div class="speed-footer">
            <p role="status" data-speed-notice>应用后在当前地图重开一局。</p>
            <div class="speed-actions">
              <button type="button" class="button" data-speed-defaults disabled>恢复默认</button>
              <button type="submit" class="button primary" disabled>应用并重开</button>
            </div>
          </div>
        </form>
      </details>

      <div class="seed-controls">
        <span>地图种子 <output id="seed" aria-live="polite"></output></span>
        <button type="button" class="button" id="shuffle" disabled>换地图</button>
      </div>

      <section class="cabinet" aria-label="无尽街区追逐">
        <div class="stage-bar">
          <div class="pace"><strong id="speed">0.0</strong> <span>m/s</span></div>
        </div>
        <div id="view" class="view" aria-label="方块街区的实时三维画面">
          <span class="camera-corner top-left"></span><span class="camera-corner top-right"></span>
          <span class="camera-corner bottom-left"></span><span class="camera-corner bottom-right"></span>
          <p id="error" class="load-error" hidden></p>
        </div>
        <div class="track-row chase-stats" aria-label="追逐数据">
          <span>已跑 <strong id="distance">0 米</strong></span>
          <span>相距 <strong id="gap">16.0 米</strong></span>
          <span>警察 <strong id="police-speed">0.0 m/s</strong></span>
        </div>
        <div class="dock">
          <div id="typing" class="typing">
            <label for="typing-input">按原文输入</label>
            <div id="article-window" class="article-window" aria-hidden="true" lang="en">
              <div id="article-track" class="article-track"></div>
            </div>
            <p id="hint">打对第一个字符起跑，空格和标点也要输入。</p>
            <input id="typing-input" type="text" lang="en" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="hint active-character" disabled />
            <span class="sr-only" id="active-character"></span>
          </div>
          <button class="button" type="button" id="pause" disabled>暂停</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
